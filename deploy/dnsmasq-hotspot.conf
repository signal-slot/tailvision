# Extra options for the dnsmasq instances NetworkManager runs for the shared
# networks (setup hotspot on wlan0, USB Ethernet link on usb0). The unit's
# name and the names the operating systems probe right after joining a
# network resolve to the unit's address on the link the query came in on, so
# the probes reach the setup page: a phone that joins the hotspot opens its
# "sign in to network" window there. Every other name is forwarded upstream.
# tailvision rewrites this file on start and whenever the hostname changes.
localise-queries
interface-name=tailvision.local,wlan0
interface-name=tailvision.local,usb0
interface-name=connectivitycheck.gstatic.com,wlan0
interface-name=connectivitycheck.gstatic.com,usb0
interface-name=connectivitycheck.android.com,wlan0
interface-name=connectivitycheck.android.com,usb0
interface-name=clients3.google.com,wlan0
interface-name=clients3.google.com,usb0
interface-name=captive.apple.com,wlan0
interface-name=captive.apple.com,usb0
interface-name=www.msftconnecttest.com,wlan0
interface-name=www.msftconnecttest.com,usb0
interface-name=www.msftncsi.com,wlan0
interface-name=www.msftncsi.com,usb0
interface-name=detectportal.firefox.com,wlan0
interface-name=detectportal.firefox.com,usb0
interface-name=connectivity-check.ubuntu.com,wlan0
interface-name=connectivity-check.ubuntu.com,usb0
interface-name=nmcheck.gnome.org,wlan0
interface-name=nmcheck.gnome.org,usb0
interface-name=network-test.debian.org,wlan0
interface-name=network-test.debian.org,usb0
interface-name=networkcheck.kde.org,wlan0
interface-name=networkcheck.kde.org,usb0
