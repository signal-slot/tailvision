# Extra options for the dnsmasq instance NetworkManager runs for the setup
# hotspot (wlan0). The unit's name and the names the operating systems probe
# right after joining a network resolve to the unit's hotspot address, so the
# probes reach the setup page: a phone that joins the hotspot opens its
# "sign in to network" window there. Every other name is forwarded upstream.
# tailvision rewrites this file on start and whenever the hostname changes.
interface-name=tailvision,wlan0
interface-name=tailvision.local,wlan0
interface-name=connectivitycheck.gstatic.com,wlan0
interface-name=connectivitycheck.android.com,wlan0
interface-name=clients3.google.com,wlan0
interface-name=captive.apple.com,wlan0
interface-name=www.msftconnecttest.com,wlan0
interface-name=www.msftncsi.com,wlan0
interface-name=detectportal.firefox.com,wlan0
interface-name=connectivity-check.ubuntu.com,wlan0
interface-name=nmcheck.gnome.org,wlan0
interface-name=network-test.debian.org,wlan0
interface-name=networkcheck.kde.org,wlan0
