# tailvision: do not let udev auto-load dwc2 from the device tree at boot.
# With dwc2 bound but no gadget configured yet, the host at the other end sees
# a device that fails enumeration and may power-cycle the port, which resets
# a unit powered through that cable. tailvision runs `modprobe dwc2` itself
# once the gadget is ready. A plain blacklist still allows that explicit load.
blacklist dwc2
